name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: JioTV-Max-Windows
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: JioTV-Max-Windows/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          [ "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}" ] || { echo "Tag does not match package.json version"; exit 1; }

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run test suite
        run: pnpm test

      - name: Build and publish release (electron-builder --publish always)
        run: pnpm dist --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_VMP_SIGN: ${{ secrets.EVS_ACCESS_TOKEN == '' && 'true' || 'false' }}

      - name: Publish delta update blockmap
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          blockmaps=(release/*.blockmap)
          if [ ${#blockmaps[@]} -gt 0 ]; then
            for f in "${blockmaps[@]}"; do
              echo "Uploading $f to GitHub release ${GITHUB_REF_NAME}..."
              gh release upload "${GITHUB_REF_NAME}" "$f" --clobber
            done
          else
            echo "No .blockmap found in release/, generating from installer..."
            node -e "
              (async () => {
                const fs = require('fs');
                const { buildBlockMap } = require('./node_modules/app-builder-lib/out/targets/blockmap/blockmap.js');
                const exes = fs.readdirSync('release').filter(f => f.endsWith('.exe') && !f.includes('uninstaller'));
                if (exes.length > 0) {
                  const exe = 'release/' + exes[0];
                  const bm = exe + '.blockmap';
                  await buildBlockMap(exe, 'gzip', bm);
                  console.log('Generated ' + bm);
                  const { execSync } = require('child_process');
                  execSync('gh release upload \"' + process.env.GITHUB_REF_NAME + '\" \"' + bm + '\" --clobber', { stdio: 'inherit' });
                }
              })().catch(err => { console.error(err); process.exit(1); });
            "
          fi

      - name: Publish release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f ../release-notes.md ]; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file ../release-notes.md --draft=false
          elif [ -f release-notes.md ]; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.md --draft=false
          else
            gh release edit "${GITHUB_REF_NAME}" --generate-notes --draft=false
          fi
