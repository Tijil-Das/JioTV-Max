<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Installing Updates</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    :root {
      --bg: #0A0A0B;
      --text: #F4F4F5;
      --spinner: #E11D2E;
      --spinner-track: rgba(255, 255, 255, 0.1);
      --border: rgba(255, 255, 255, 0.08);
      --icon-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #FFFFFF;
        --text: #18181B;
        --spinner: #E11D2E;
        --spinner-track: rgba(0, 0, 0, 0.08);
        --border: rgba(0, 0, 0, 0.08);
        --icon-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      }
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .app-icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      object-fit: contain;
      box-shadow: var(--icon-shadow);
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid var(--spinner-track);
      border-top-color: var(--spinner);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    .text {
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }
  </style>
</head>
